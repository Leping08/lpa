id: 49308
name: lpa
environments:
  production:
    memory: 1024
    cli-memory: 512
    scheduler: false
    runtime: "php-8.5:al2023"
    domain: lpabob.com
    build:
      - "COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev"
      - "php artisan event:cache"
      - "npm ci && npm run build && rm -rf node_modules"
